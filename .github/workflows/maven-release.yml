# Push a tag gocd-chartmuseum-package-repo-plugin-<version> (matching <version> in pom.xml)
# to run the full test matrix and publish a GitHub release with the jar and its checksums.
# The release notes are the "## <version>" section of CHANGELOG.md.
name: Release

on:
  push:
    tags:
      - 'gocd-chartmuseum-package-repo-plugin-[0-9]+*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/maven.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Check the tag matches the pom version
      id: version
      run: |
        version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
        tag_version="${GITHUB_REF_NAME#gocd-chartmuseum-package-repo-plugin-}"
        if [ "$version" != "$tag_version" ]; then
          echo "Tag says $tag_version but pom.xml says $version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Build
      run: mvn -B -DskipTests package
    - name: Write release notes
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        awk -v v="$VERSION" '$0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "CHANGELOG.md has no section '## $VERSION'" >&2
          exit 1
        fi
        {
          echo
          echo "## Checksums"
          echo
          echo "| Type | Digest |"
          echo "|------|--------|"
          echo "| SHA256 | \`$(sha256sum target/chartmuseum.material.poller.jar | cut -d' ' -f1)\` |"
          echo "| MD5 | \`$(md5sum target/chartmuseum.material.poller.jar | cut -d' ' -f1)\` |"
        } >> notes.md
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" target/chartmuseum.material.poller.jar \
          --title "${{ steps.version.outputs.version }}" \
          --notes-file notes.md

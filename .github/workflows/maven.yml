name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: Build and test (unit tests plus a ChartMuseum container)
      run: mvn -B package
    - uses: actions/upload-artifact@v4
      with:
        name: chartmuseum.material.poller.jar
        path: target/chartmuseum.material.poller.jar

  # Boots each GoCD server release in Docker with the built jar and checks a pipeline triggers
  # on new chart versions. 23.1.0 is the oldest supported release (target-go-version in the pom).
  gocd-compat:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gocd: [ 23.1.0, 23.3.0, 23.5.0, 24.5.0, 25.4.0, 26.1.0, 26.2.0 ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: GoCD ${{ matrix.gocd }}
      run: mvn -B verify -Pgocd-compat -Dgocd.version=${{ matrix.gocd }} -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
